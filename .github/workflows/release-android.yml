name: 📦 Release QRISKas Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Install Android SDK Platforms
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: 🔑 Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Prepare APK
        id: prepare
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Rename to readable filename
          cp "$APK" "QRISKas-Mobile-${TAG}.apk"
          echo "apk_file=QRISKas-Mobile-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: ${{ steps.prepare.outputs.apk_file }}
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: "QRISKas Mobile ${{ steps.prepare.outputs.tag }}"
          body: |
            ## 📱 QRISKas Mobile ${{ steps.prepare.outputs.tag }}

            Aplikasi kasir mobile native untuk **QRISKas (Tahunya Krispiya)**.

            ---

            ### ⚡ Yang Baru di Versi Ini
            - **Kamera pre-warm**: file foto disiapkan saat app buka → kamera buka instan tanpa jeda
            - **Popup "⏳ Sedang memproses foto..."**: kasir tahu proses berjalan, layar tidak blank
            - **Proses foto async (Coroutine IO)**: kompresi foto lebih cepat, UI tidak freeze
            - **Auto-cleanup file lama**: foto sementara dihapus otomatis setelah 1 jam
            - **Deskripsi README** yang lebih lengkap & SEO-friendly

            ### 📲 Cara Install di HP Android
            1. Unduh file **`QRISKas-Mobile-${{ steps.prepare.outputs.tag }}.apk`** di bawah
            2. Buka file APK di HP
            3. Kalau muncul "Install dari sumber tidak dikenal" → ketuk **Izinkan**
            4. Ketuk **Install** → selesai! Buka aplikasi **QRISKas**

            > 💡 Kalau sudah punya versi lama, cukup install di atas (upgrade otomatis, data tidak hilang)

            ### 📋 Info Teknis
            | | |
            |---|---|
            | **Ukuran APK** | ~${{ steps.prepare.outputs.apk_size }} |
            | **Min Android** | 8.0 Oreo (API 26) |
            | **Target Android** | 13 (API 33) |
            | **Arsitektur** | arm64-v8a, armeabi-v7a |

            ---
            *🤖 Built automatically via GitHub Actions*
          files: ${{ steps.prepare.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
