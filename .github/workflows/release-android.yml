name: 📦 Release QRISKas Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.4.2)'
        required: true
        default: 'v1.5.0'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Install Android SDK Platforms
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: 🔑 Setup Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > /tmp/qriskas-release.jks
            FILESIZE=$(stat -c%s "/tmp/qriskas-release.jks" 2>/dev/null || echo 0)
            if [ "$FILESIZE" -gt 500 ]; then
              echo "KEYSTORE_PATH=/tmp/qriskas-release.jks" >> $GITHUB_ENV
              echo "✅ Release keystore decoded from secret ($FILESIZE bytes)"
            fi
          elif [ -f "mobile/android/app/qriskas-release.jks" ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/mobile/android/app/qriskas-release.jks" >> $GITHUB_ENV
            echo "✅ Using bundled release keystore from repository"
          else
            echo "❌ Release keystore not found anywhere! Halting."
            exit 1
          fi

      - name: 🔑 Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'qriskas2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'qriskas' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'qriskas2026' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🔍 Verify APK Signature Certificate
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "=== VERIFIKASI SERTIFIKAT APK ==="
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK"
          else
            echo "⚠️ APK release not found for verification"
          fi

      - name: 🗑️ Cleanup Keystore
        if: always()
        run: rm -f /tmp/qriskas-release.jks

      - name: 📦 Prepare APK
        id: prepare
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Rename to readable filename
          cp "$APK" "QRISKas-Mobile-${TAG}.apk"
          echo "apk_file=QRISKas-Mobile-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: ${{ steps.prepare.outputs.apk_file }}
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: "QRISKas Mobile ${{ steps.prepare.outputs.tag }}"
          body: |
            ## 📱 QRISKas Mobile ${{ steps.prepare.outputs.tag }}

            Aplikasi kasir mobile native untuk **QRISKas (Tahunya Krispiya)**.

            ---

            ### ⚡ Yang Baru di Versi Ini (v1.5.0)
            - **Mode Scan Delay Save (Foto Dulu, Nominal Nanti)**: Fitur baru di Pengaturan! Saat aktif, foto langsung tersimpan tanpa perlu isi nominal. Kasir bisa lanjut melayani pelanggan berikutnya dengan super cepat.
            - **Tombol Pending dengan Badge Counter**: Lihat berapa foto yang masih belum diisi nominal lewat badge angka di tombol Pending.
            - **Dialog Pending dengan Preview Foto**: Buka daftar transaksi pending lengkap dengan thumbnail foto. Klik foto untuk memperbesar. Klik "Isi Nominal" untuk konfirmasi.
            - **Konfirmasi Nominal Pending**: Dialog konfirmasi lengkap dengan preview foto, input nominal, catatan, dan opsi surplus/tukar cash/struk cash.
            - **Tidak Bentrok dengan Fitur Lama**: Fitur delay save sepenuhnya opsional dan tidak mengganggu alur scan normal.

            ### 📲 Cara Install di HP Android
            1. Unduh file **`QRISKas-Mobile-${{ steps.prepare.outputs.tag }}.apk`** di bawah
            2. Buka file APK di HP
            3. Kalau muncul "Install dari sumber tidak dikenal" → ketuk **Izinkan**
            4. Ketuk **Install** → selesai! Buka aplikasi **QRISKas**

            > 💡 Kalau sudah punya versi lama dengan signature berbeda, **uninstall dulu** lalu install versi ini. Update selanjutnya bisa langsung tanpa uninstall.

            ### 📋 Info Teknis
            | | |
            |---|---|
            | **Ukuran APK** | ~${{ steps.prepare.outputs.apk_size }} |
            | **Min Android** | 8.0 Oreo (API 26) |
            | **Target Android** | 13 (API 33) |
            | **Arsitektur** | arm64-v8a, armeabi-v7a |

            ---
            *🤖 Built automatically via GitHub Actions*
          files: ${{ steps.prepare.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
