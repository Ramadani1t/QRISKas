name: 📦 Release QRISKas Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Install Android SDK Platforms
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: 🔑 Decode Release Keystore
        # Decode keystore dari GitHub Secret ke file sementara di runner
        # Menggunakan tr -d untuk membersihkan karakter carriage return (\r) atau spasi dari Windows
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > /tmp/qriskas-release.jks
            FILESIZE=$(stat -c%s "/tmp/qriskas-release.jks" 2>/dev/null || echo 0)
            if [ "$FILESIZE" -gt 500 ]; then
              echo "KEYSTORE_PATH=/tmp/qriskas-release.jks" >> $GITHUB_ENV
              echo "✅ Release keystore decoded successfully ($FILESIZE bytes)"
            else
              echo "KEYSTORE_PATH=" >> $GITHUB_ENV
              echo "⚠️  Keystore file invalid or too small ($FILESIZE bytes) — falling back to debug key"
            fi
          else
            echo "KEYSTORE_PATH=" >> $GITHUB_ENV
            echo "⚠️  RELEASE_KEYSTORE_BASE64 secret not set — using debug key"
          fi

      - name: 🔑 Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🗑️ Cleanup Keystore
        if: always()
        run: rm -f /tmp/qriskas-release.jks

      - name: 📦 Prepare APK
        id: prepare
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Rename to readable filename
          cp "$APK" "QRISKas-Mobile-${TAG}.apk"
          echo "apk_file=QRISKas-Mobile-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: ${{ steps.prepare.outputs.apk_file }}
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: "QRISKas Mobile ${{ steps.prepare.outputs.tag }}"
          body: |
            ## 📱 QRISKas Mobile ${{ steps.prepare.outputs.tag }}

            Aplikasi kasir mobile native untuk **QRISKas (Tahunya Krispiya)**.

            ---

            ### ⚡ Yang Baru di Versi Ini (v1.4.0)
            - **Fitur Dokumentasi Struk Belanja Cash (Laci Fisik)**: Kasir dapat mencatat pengeluaran uang cash fisik/laci toko (beli es batu, gas, kresek, dsb.) lengkap dengan foto nota dan kartu bukti digital tanpa memotong saldo QRIS bank.
            - **Uji Coba Signature Update**: Memastikan in-app update dari v1.3.0 ke v1.4.0 terpasang mulus tanpa bentrok signature.
            - **Fix update APK**: download ke public Downloads, install tidak gagal lagi
            - **Fix signature**: release keystore konsisten, tidak bentrok saat update
            - **Kamera pre-warm**: file foto disiapkan saat app buka → kamera buka instan tanpa jeda
            - **Popup "⏳ Sedang memproses foto..."**: kasir tahu proses berjalan, layar tidak blank
            - **Proses foto async (Coroutine IO)**: kompresi foto lebih cepat, UI tidak freeze

            ### 📲 Cara Install di HP Android
            1. Unduh file **`QRISKas-Mobile-${{ steps.prepare.outputs.tag }}.apk`** di bawah
            2. Buka file APK di HP
            3. Kalau muncul "Install dari sumber tidak dikenal" → ketuk **Izinkan**
            4. Ketuk **Install** → selesai! Buka aplikasi **QRISKas**

            > 💡 Kalau sudah punya versi lama dengan signature berbeda, **uninstall dulu** lalu install versi ini. Update selanjutnya bisa langsung tanpa uninstall.

            ### 📋 Info Teknis
            | | |
            |---|---|
            | **Ukuran APK** | ~${{ steps.prepare.outputs.apk_size }} |
            | **Min Android** | 8.0 Oreo (API 26) |
            | **Target Android** | 13 (API 33) |
            | **Arsitektur** | arm64-v8a, armeabi-v7a |

            ---
            *🤖 Built automatically via GitHub Actions*
          files: ${{ steps.prepare.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
