name: 🤖 Build QRISKAS Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Android 13)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Install Android SDK 33
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null

      - name: 🔑 Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Debug APK (with full error capture)
        id: gradle_build
        working-directory: mobile/android
        continue-on-error: true
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 📋 Print build errors to Step Summary
        if: always()
        run: |
          EXIT="${{ steps.gradle_build.outputs.GRADLE_EXIT }}"
          
          echo "## 🔨 Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ -f /tmp/build.log ]; then
            # Print error-relevant lines
            grep -n "error\|Error\|FAILED\|Exception\|cannot\|unresolved\|not found\|Could not\|Build FAILED\|Caused by\|> Task\|compilation error" \
              /tmp/build.log | tail -80 >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "--- LAST 50 LINES ---" >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No build log found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ✅ Check build result
        run: |
          EXIT="${{ steps.gradle_build.outputs.GRADLE_EXIT }}"
          if [ "$EXIT" != "0" ]; then
            echo "Build failed with exit code: $EXIT"
            exit 1
          fi

      - name: 📦 Prepare APK
        run: |
          mkdir -p artifact
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "No APK"; exit 1; }
          cp "$APK" "artifact/qriskas-mobile-debug-$(date +%Y%m%d-%H%M).apk"

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: artifact/*.apk
          retention-days: 30
