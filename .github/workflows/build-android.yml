name: 🤖 Build QRISKAS Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Android 13)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Install Android Platforms & Build Tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: 🔑 Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Prepare APK Artifact
        if: success()
        run: |
          mkdir -p artifact
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK"
          cp "$APK" "artifact/qriskas-mobile-debug.apk"

      - name: ⬆️ Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: artifact/qriskas-mobile-debug.apk
          retention-days: 30
