name: 🤖 Build QRISKAS Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Android 13)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ──────────────────────────────────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Cache Gradle ────────────────────────────────────────────────────
      - name: 🗃️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Install Android SDK 33 ──────────────────────────────────────────
      - name: 📱 Install Android SDK 33
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" > /dev/null

      # ── 5. Create local.properties ─────────────────────────────────────────
      - name: 🔑 Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties
          cat mobile/android/local.properties

      # ── 6. Grant gradlew ───────────────────────────────────────────────────
      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      # ── 7. Validate Gradle files ───────────────────────────────────────────
      - name: 🔍 Validate project structure
        working-directory: mobile/android
        run: |
          echo "=== Root build.gradle.kts ==="
          cat build.gradle.kts
          echo ""
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo ""
          echo "=== libs.versions.toml ==="
          cat gradle/libs.versions.toml
          echo ""
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts

      # ── 8. Build Debug APK ─────────────────────────────────────────────────
      - name: 🔨 Build Debug APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 9. Find APK ────────────────────────────────────────────────────────
      - name: 📦 Prepare APK artifact
        run: |
          mkdir -p artifact
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "❌ APK not found"; find mobile/android/app/build/ -type f 2>/dev/null; exit 1; }
          echo "✅ APK: $APK"
          cp "$APK" "artifact/qriskas-mobile-debug-$(date +%Y%m%d-%H%M).apk"
          ls -lh artifact/

      # ── 10. Upload artifact ────────────────────────────────────────────────
      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: artifact/*.apk
          retention-days: 30

      # ── 11. Summary ────────────────────────────────────────────────────────
      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 📱 QRISKAS Mobile" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | QRISKAS Mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | id.qriskas.mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Android 13 (API 33) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "> ✅ APK siap di tab **Artifacts**" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ Build gagal — lihat logs" >> $GITHUB_STEP_SUMMARY
          fi
