name: 🤖 Build QRISKAS Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Android 13)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 ───────────────────────────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Cache Gradle ───────────────────────────────────────────────────
      - name: 🗃️ Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Setup Android SDK via sdkmanager ──────────────────────────────
      - name: 📱 Setup Android SDK components
        run: |
          # ANDROID_SDK_ROOT sudah tersedia di ubuntu-latest runner
          echo "Android SDK Root: $ANDROID_SDK_ROOT"
          
          # Accept licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install required SDK components
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools" \
            > /dev/null 2>&1

      # ── 5. Make gradlew executable ────────────────────────────────────────
      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x mobile/android/gradlew

      # ── 6. Build Debug APK ────────────────────────────────────────────────
      - name: 🔨 Build Debug APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.sdk.dir=$ANDROID_SDK_ROOT
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2048m"
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # ── 7. Find & rename APK ──────────────────────────────────────────────
      - name: 📦 Prepare APK artifact
        run: |
          mkdir -p artifact
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            find mobile/android/app/build/ -type f 2>/dev/null || echo "No build output"
            exit 1
          fi
          echo "✅ Found APK: $APK_PATH"
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          cp "$APK_PATH" "artifact/qriskas-mobile-debug-${TIMESTAMP}.apk"
          ls -lh artifact/

      # ── 8. Upload artifact ────────────────────────────────────────────────
      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: artifact/*.apk
          retention-days: 30

      # ── 9. Build summary ─────────────────────────────────────────────────
      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 📱 QRISKAS Mobile Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | QRISKAS Mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | id.qriskas.mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Target SDK | Android 13 (API 33) |" >> $GITHUB_STEP_SUMMARY
          echo "| Min SDK | Android 8.0 (API 26) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | Debug |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "> ✅ APK tersedia di tab **Artifacts** — berlaku 30 hari" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ Build gagal. Cek logs untuk detail." >> $GITHUB_STEP_SUMMARY
          fi
