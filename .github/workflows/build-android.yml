name: 🤖 Build QRISKAS Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Android 13)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🗃️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📱 Install Android SDK 33
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null

      - name: 🔑 Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Build Debug APK
        id: gradle_build
        working-directory: mobile/android
        run: |
          set +e
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "❌ GRADLE BUILD FAILED (exit: $EXIT_CODE)"
            echo "========================================="
            echo "--- LAST 100 LINES ---"
            tail -100 /tmp/gradle_output.txt
            echo ""
            echo "--- ERROR LINES ---"
            grep -i "error\|exception\|failure\|FAILED\|cannot\|unresolved\|not found" /tmp/gradle_output.txt | head -40
          fi
          
          exit $EXIT_CODE
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

      - name: 📦 Prepare APK
        run: |
          mkdir -p artifact
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "❌ No APK found"; exit 1; }
          cp "$APK" "artifact/qriskas-mobile-debug-$(date +%Y%m%d-%H%M).apk"
          ls -lh artifact/

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qriskas-mobile-apk
          path: artifact/*.apk
          retention-days: 30

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 📱 QRISKAS Mobile Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | id.qriskas.mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Target SDK | Android 13 (API 33) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gradle_build.outcome }}" = "success" ]; then
            echo "> ✅ APK siap di tab **Artifacts**" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ Build gagal — lihat log step **Build Debug APK**" >> $GITHUB_STEP_SUMMARY
          fi
